<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0e1a" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Neon Casino — free-to-play virtual chips casino: Blackjack, Texas Hold'em, Hong Kong Mahjong and UNO against AI bots. No real money."
    />
    <title>Neon Casino — Blackjack · Hold'em · Mahjong · UNO</title>
    <style>
      /* Inline boot screen: paints instantly, before any CSS/JS is fetched. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0e1a;
        color: #f8f5ec;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overscroll-behavior: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 18px;
        justify-items: center;
        background: radial-gradient(120% 100% at 50% 0%, #131a2e 0%, #0a0e1a 70%);
        z-index: 9999;
        transition: opacity 0.45s ease;
      }
      #boot .neon {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(28px, 9vw, 62px);
        font-weight: 700;
        letter-spacing: 0.12em;
        color: #f5e6b8;
        text-shadow: 0 0 6px #d4af37, 0 0 22px rgba(212, 175, 55, 0.65), 0 0 60px rgba(212, 175, 55, 0.35);
        animation: bootFlicker 3.2s infinite;
      }
      #boot .bar {
        width: min(64vw, 320px);
        height: 6px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.09);
        overflow: hidden;
        border: 1px solid rgba(212, 175, 55, 0.35);
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 20%;
        border-radius: 99px;
        background: linear-gradient(90deg, #d4af37, #f5e6b8);
        animation: bootSlide 1.1s ease-in-out infinite;
      }
      #boot small {
        color: #9aa3b2;
        letter-spacing: 0.18em;
        font-size: 11px;
        text-transform: uppercase;
      }
      @keyframes bootSlide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(520%);
        }
      }
      @keyframes bootFlicker {
        0%,
        100% {
          opacity: 1;
        }
        92% {
          opacity: 1;
        }
        94% {
          opacity: 0.55;
        }
        96% {
          opacity: 1;
        }
        97% {
          opacity: 0.7;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="neon">NEON CASINO</div>
      <div class="bar"><i></i></div>
      <small>Shuffling the deck…</small>
    </div>

    <!-- App root. All rendering is done by TypeScript (src/main.ts). -->
    <div id="app"></div>

    <noscript>
      <div style="padding: 24px; font-size: 16px">
        Neon Casino needs JavaScript enabled. Please enable it and reload.
      </div>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Deploy Neon Casino to GitHub Pages

# Standalone-repo workflow: use this file when neon-casino/ ITSELF is the repo
# root (e.g. you copied just this folder into its own repository). When the
# whole CasinoWebGame repo is pushed, the repo-root workflow
# (/.github/workflows/deploy.yml) is the active one.
#
# To enable: Settings -> Pages -> Source: "GitHub Actions" (one-time manual step).
# Public URL afterwards: https://<USERNAME>.github.io/<REPO_NAME>/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

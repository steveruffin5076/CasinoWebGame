<!-- ==========================================================================
     mahjongFaces.svg — shared defs for the mahjong tile faces:
     ivory bevel gradients, inks, bamboo stick + dot primitives, wind letters,
     dragon glyphs and the "wan" (萬) character used by the Cracks suit.
     Arrangements (1-9) are composed in TypeScript (src/mahjong/tiles.ts).
     ======================================================================= -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <linearGradient id="mj-ivory" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#ffffff" />
    <stop offset="0.45" stop-color="#faf7ef" />
    <stop offset="1" stop-color="#e6dfcd" />
  </linearGradient>
  <linearGradient id="mj-bevel-t" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95" />
    <stop offset="1" stop-color="#d9d0b8" stop-opacity="0.9" />
  </linearGradient>
  <linearGradient id="mj-side" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#efe7d3" />
    <stop offset="1" stop-color="#c9bfa4" />
  </linearGradient>
  <linearGradient id="mj-back" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#3f7f56" />
    <stop offset="1" stop-color="#14532d" />
  </linearGradient>
  <radialGradient id="mj-dot" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#7fd6ff" />
    <stop offset="0.55" stop-color="#1d7fd0" />
    <stop offset="1" stop-color="#0d3f78" />
  </radialGradient>
  <radialGradient id="mj-dot-r" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#ffb3b3" />
    <stop offset="0.55" stop-color="#d63b3b" />
    <stop offset="1" stop-color="#7a1414" />
  </radialGradient>
  <radialGradient id="mj-dot-g" cx="0.35" cy="0.3" r="0.75">
    <stop offset="0" stop-color="#b6f2c4" />
    <stop offset="0.55" stop-color="#2f9e4f" />
    <stop offset="1" stop-color="#14532d" />
  </radialGradient>
  <linearGradient id="mj-bam" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1f7a3f" />
    <stop offset="0.45" stop-color="#41c06a" />
    <stop offset="1" stop-color="#14532d" />
  </linearGradient>

  <!-- one bamboo stick -->
  <symbol id="mj-stick" viewBox="0 0 20 60">
    <rect x="7" y="4" width="6" height="52" rx="3" fill="url(#mj-bam)" />
    <rect x="7" y="18" width="6" height="3" fill="#0e3b1f" opacity="0.75" />
    <rect x="7" y="38" width="6" height="3" fill="#0e3b1f" opacity="0.75" />
    <path d="M4 30 h12" stroke="#0b2b17" stroke-width="1.6" opacity="0.55" />
    <rect x="8.4" y="5" width="3.2" height="50" rx="1.6" fill="#ffffff" opacity="0.22" />
  </symbol>

  <!-- wind letters (stylised Latin E / S / W / N inside a cartouche) -->
  <symbol id="mj-wind-frame" viewBox="0 0 100 100">
    <rect
      x="8"
      y="8"
      width="84"
      height="84"
      rx="10"
      fill="none"
      stroke="#1f4f8f"
      stroke-width="3"
      opacity="0.55"
    />
  </symbol>

  <!-- 中 (red dragon) -->
  <symbol id="mj-chung" viewBox="0 0 100 100">
    <rect x="34" y="20" width="32" height="46" fill="none" stroke="#c62828" stroke-width="8" />
    <rect x="46" y="6" width="8" height="88" fill="#c62828" />
  </symbol>
  <!-- 發 (green dragon) — stylised glyph built from strokes -->
  <symbol id="mj-fa" viewBox="0 0 100 100">
    <g stroke="#1b7a3a" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M14 20 h22 M52 16 h30" />
      <path d="M22 20 v14 M60 16 l6 12" />
      <path d="M12 42 h44 M64 40 h26" />
      <path d="M24 42 v22 M40 42 v22" />
      <path d="M18 62 h34" />
      <path d="M62 56 q16 6 26 22" />
      <path d="M70 78 l-10 14 M82 74 l4 16" />
    </g>
  </symbol>
  <!-- 萬 (wan / character mark for the Cracks suit) -->
  <symbol id="mj-wan" viewBox="0 0 100 100">
    <g stroke="#c62828" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M14 26 h72" />
      <path d="M30 12 v14 M70 12 v14" />
      <rect x="26" y="36" width="48" height="30" />
      <path d="M50 36 v30 M26 51 h48" />
      <path d="M30 66 v22 M70 66 v22" />
      <path d="M30 88 h40" />
      <path d="M50 74 l6 14 M68 74 l-4 14" />
    </g>
  </symbol>
</svg>

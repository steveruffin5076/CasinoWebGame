<!-- ==========================================================================
     avatars.svg — shared defs + accessories for the AI bot avatars.
     Faces are composed in TypeScript (src/assets/avatars.ts) so the mood
     (normal / thinking / happy / sad) can be swapped at runtime.
     ======================================================================= -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <radialGradient id="av-head" cx="0.35" cy="0.28" r="0.85">
    <stop offset="0" stop-color="#f6d3b4" />
    <stop offset="1" stop-color="#c98f63" />
  </radialGradient>
  <radialGradient id="av-ring" cx="0.32" cy="0.24" r="0.8">
    <stop offset="0" stop-color="#4a5588" />
    <stop offset="0.62" stop-color="#1a2140" />
    <stop offset="1" stop-color="#0b0f1d" />
  </radialGradient>
  <linearGradient id="av-gold" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#f5e6b8" />
    <stop offset="0.5" stop-color="#d4af37" />
    <stop offset="1" stop-color="#8c6d1f" />
  </linearGradient>

  <!-- accessories -->
  <symbol id="acc-shades" viewBox="0 0 100 60">
    <path d="M8 20 h34 l-4 22 h-26 z" fill="#12131c" opacity="0.92" />
    <path d="M58 20 h34 l-4 22 h-26 z" fill="#12131c" opacity="0.92" />
    <path d="M42 24 h16 v6 h-16 z" fill="#12131c" opacity="0.92" />
    <path d="M12 26 l20 2 M62 26 l20 2" stroke="#5eead4" stroke-width="2" opacity="0.55" />
  </symbol>
  <symbol id="acc-visor" viewBox="0 0 100 60">
    <path d="M6 18 h88 l-6 24 h-76 z" fill="#1c2340" />
    <path
      d="M12 26 h76 M12 33 h76"
      stroke="#22d3ee"
      stroke-width="2.5"
      opacity="0.75"
      stroke-linecap="round"
    />
  </symbol>
  <symbol id="acc-cap" viewBox="0 0 100 60">
    <path d="M10 40 a40 34 0 0 1 80 0 z" fill="#b91c1c" />
    <path d="M8 40 h84 v7 h-84 z" fill="#7f1d1d" />
    <path d="M50 4 v36" stroke="#7f1d1d" stroke-width="3" />
  </symbol>
  <symbol id="acc-fedora" viewBox="0 0 100 60">
    <ellipse cx="50" cy="44" rx="46" ry="10" fill="#2b2118" />
    <path d="M28 42 v-26 h44 v26 z" fill="#3b2314" />
    <path d="M28 24 h44 v6 h-44 z" fill="#5b3a20" />
  </symbol>
  <symbol id="acc-antenna" viewBox="0 0 100 60">
    <path d="M50 46 v-30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <circle cx="50" cy="10" r="6" fill="#e879f9" />
    <circle cx="50" cy="10" r="10" fill="#e879f9" opacity="0.25" />
  </symbol>
  <symbol id="acc-clover" viewBox="0 0 100 60">
    <g fill="#22c55e">
      <circle cx="42" cy="20" r="11" />
      <circle cx="58" cy="20" r="11" />
      <circle cx="42" cy="36" r="11" />
      <circle cx="58" cy="36" r="11" />
    </g>
    <path d="M50 42 v16" stroke="#16a34a" stroke-width="4" stroke-linecap="round" />
  </symbol>
  <symbol id="acc-crown" viewBox="0 0 100 60">
    <path d="M14 40 l6-30 14 16 16-22 16 22 14-16 6 30 z" fill="url(#av-gold)" />
    <circle cx="50" cy="14" r="4" fill="#ef4444" />
    <circle cx="26" cy="20" r="3" fill="#22d3ee" />
    <circle cx="74" cy="20" r="3" fill="#22c55e" />
  </symbol>
  <symbol id="acc-headset" viewBox="0 0 100 60">
    <path
      d="M12 34 v-8 a38 38 0 0 1 76 0 v8"
      fill="none"
      stroke="#1f2937"
      stroke-width="7"
      stroke-linecap="round"
    />
    <rect x="4" y="30" width="16" height="20" rx="6" fill="#111827" />
    <rect x="80" y="30" width="16" height="20" rx="6" fill="#111827" />
    <path d="M20 40 q-8 12 4 16" stroke="#111827" stroke-width="4" fill="none" />
    <circle cx="30" cy="57" r="4" fill="#22d3ee" />
  </symbol>
</svg>
